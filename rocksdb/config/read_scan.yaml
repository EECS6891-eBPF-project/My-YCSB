# Database Parameters
database:
  key_size: 16
  value_size: 100
  nr_entry: 1000000

# Workload Parameters
workload:
  warmup_runtime_seconds: 0
  runtime_seconds: 120
  nr_warmup_op: 0
  nr_op: 10000000
  nr_thread: 6
  next_op_interval_ns: 0

  operation_proportion:
    read: 0.9
    update: 0
    insert: 0
    scan: 0.1
    read_modify_write: 0

  request_distribution: "uniform"
  zipfian_constant: 0.99
  scan_length: 100000
  trace_file_list:
    - "./cur_trace"

# RocksDB Parameters
rocksdb:
  data_dir: "/mydata/rocksdb_db_test"
  options_file: "/mydata/My-YCSB/rocksdb/config/rocksdb_rubble_16gb_config.ini"
  cache_size: 0
  print_stats: true

